# fde-agent k8s 部署骨架（M4 里程碑细化）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fde-agent-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fde-agent
  labels:
    app: fde-agent
spec:
  replicas: 1 # PGlite 是嵌入式单写库，不要扩副本
  selector:
    matchLabels:
      app: fde-agent
  template:
    metadata:
      labels:
        app: fde-agent
    spec:
      containers:
        - name: web
          image: fde-agent:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: fde-agent-secrets # GLM_API_KEY / DEEPSEEK_API_KEY / FEISHU_* / WECOM_* ...
          volumeMounts:
            - name: data
              mountPath: /app/.data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fde-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: fde-agent
spec:
  selector:
    app: fde-agent
  ports:
    - port: 80
      targetPort: 3000
